name: Claude Code Review

# Reviews each PR automatically and posts inline comments (issue #44).
# Based on the review example in https://code.claude.com/docs/en/github-actions
# Drafts are skipped, so the review runs when a PR is marked ready for review.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push cancels a review still running for the same PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork and Dependabot PRs don't get the CLAUDE_CODE_OAUTH_TOKEN secret, so the
    # review would fail on them. Skip them instead; a skipped job shows grey, not red (issue #47).
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # Runs on the repo owner's Claude subscription. Create the token with
          # `claude setup-token` (valid for a year) and save it as this repo secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The inline-comment tool only starts when --allowedTools names it.
          # This repo keeps its rules in AGENTS.md, not CLAUDE.md, so point the review at it.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "This repository's agent instructions are in AGENTS.md (there is no CLAUDE.md). Treat AGENTS.md as the project's CLAUDE.md when checking the change against project rules."
