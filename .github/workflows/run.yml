name: Run script

on:
  # The daily run is started at 19:04 UTC by the Cloudflare Worker in
  # scheduler/ (issue #51), because GitHub runs schedules hours late. This
  # schedule is only a backup in case the Worker fails. It is set 30 minutes
  # after the Worker so it never runs first, and early enough that GitHub's
  # usual delay rarely pushes it past midnight Eastern.
  schedule:
    - cron: '34 19 * * *'
  workflow_dispatch:

# A Worker-started run and the backup run can't overlap and race to push
# (issue #17).
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  check:
    # The backup schedule only matters when the Worker's run failed. Skip it
    # if a manual or Worker-started run already succeeded in the last 20
    # hours, so there is no second scrape and no second notification
    # (issue #51). The concurrency group above makes this wait for that run.
    name: skip-if-already-run
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
    - id: check
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ "$GITHUB_EVENT_NAME" != schedule ]; then
          echo "skip=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        since=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)
        # If GitHub's API fails, run anyway: a duplicate beats a missed day.
        n=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/run.yml/runs" \
              -f event=workflow_dispatch -f status=success -f created=">=$since" \
              --jq '.total_count' || echo 0)
        if [ "$n" -gt 0 ]; then
          echo "::notice::A workflow_dispatch run already succeeded since $since; skipping the backup run."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

  run:
    name: run-script
    needs: check
    if: needs.check.outputs.skip != 'true'
    # Pinned: the locked Playwright can't install webkit on ubuntu-26.04, which
    # ubuntu-latest now resolves to. Upgrade Playwright before moving this.
    runs-on: ubuntu-24.04
    env:
      # Daily phone notification via ntfy. Unset the secret to turn it off.
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        # Install a specific version of uv.
        version: "0.6.14"
        enable-cache: true
    - name: Set up Python
      run: uv python install
    - name: Install the project
      run: uv sync
    - name: Scrape from page JSON
      # Most days the page JSON works and no browser is needed (issue #56).
      # SCRAPE_SOURCE=json fails instead of falling back, and writes nothing
      # when it fails, so the fallback step below starts clean.
      id: json
      continue-on-error: true
      env:
        SCRAPE_SOURCE: json
      run: uv run pytest search.py
    - name: Setup playwright
      if: steps.json.outcome == 'failure'
      run: |
        echo "::warning::JSON step failed, installing webkit for the Playwright fallback"
        uv run playwright install --with-deps webkit
    - name: Scrape with Playwright fallback
      # Same run as before issue #56: it tries the JSON again, and if that
      # still fails it logs why in scrape_log.csv, prints a ::warning:: and
      # scrapes with Playwright. Retry a failed zip code (e.g. a slow page
      # load, #48) before giving up.
      if: steps.json.outcome == 'failure'
      run: |
        # Drop anything the JSON step wrote, so no row is written twice (#15).
        git checkout -- irving_oil_prices.csv oil_prices_by_dealer.csv scrape_log.csv
        uv run pytest --browser=webkit --reruns 2 --reruns-delay 30 search.py
    - name: Commit the update
      run: |
        git config --global user.email "chris.rowe@wri.org"
        git config --global user.name "Github Actions"
        git add irving_oil_prices.csv oil_prices_by_dealer.csv scrape_log.csv
        # A rerun on the same day can leave the data unchanged (#15).
        git diff --cached --quiet || git commit -m "Github actions run"
        # main may have moved during the run (a merge, or another run).
        git pull --rebase
        git push
    - name: Send ntfy notification
      if: ${{ env.NTFY_TOPIC != '' }}
      run: uv run python notify.py
