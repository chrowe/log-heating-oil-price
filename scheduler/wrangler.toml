# Cloudflare Worker that starts the daily scrape on time (issue #51).
# See scheduler/README.md for setup.
name = "log-heating-oil-price-scheduler"
main = "src/index.js"
compatibility_date = "2026-11-01"

# No public URL: the Worker only runs on its cron trigger.
workers_dev = false
preview_urls = false

[triggers]
# UTC. 19:04 UTC is 14:04 EST / 15:04 EDT, after Irving's observed update
# window of about 10:30-13:30 ET (issue #14).
crons = ["4 19 * * *"]

[vars]
GITHUB_REPO = "chrowe/log-heating-oil-price"
WORKFLOW = "run.yml"
REF = "main"

[observability]
enabled = true
